<section class="phero"><div class="wrap {{m_figure_class}}">
  <div>
    <nav class="crumbs" aria-label="Breadcrumb"><a href="{{base}}">Home</a><span>/</span><span>{{m_name}}</span></nav>
    <div class="top" style="margin-top:16px"><span class="ico"><svg class="icon"><use href="#i-{{m_icon}}"/></svg></span>{{m_status}}</div>
    <h1 style="margin-top:16px">{{m_name}}</h1>
    <p class="sub" style="margin-top:12px">{{m_intro}}</p>
    <div class="meta" style="margin-top:18px"><span>For <b>{{m_audience}}</b></span></div>
  </div>
  {{m_figure}}
</div></section>

<section class="band"><div class="wrap">
  <div class="kicker">How it works</div>
  <h2>{{m_steps_title}}</h2>
  <ol class="steps">{{m_steps}}</ol>
</div></section>

{{module_extra}}

<section class="band closing"><div class="wrap">
  <div class="kicker">Related</div>
  <ul class="services single" style="max-width:640px">{{m_related}}</ul>
</div></section>
