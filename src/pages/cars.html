<!-- {"title": "Inspected cars | Saaz", "description": "Used cars in Kampala that passed a Saaz inspection, each shown with its report.", "nav": "cars"} -->
<section class="band compact"><div class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="{{base}}">Home</a><span>/</span><span>Inspected cars</span></nav>
  <div class="sechead"><h1>Inspected cars</h1><p>Every car here passed a Saaz inspection at a partner garage. The report is on the listing.</p></div>
  <form id="carfilter" class="filters" hidden>
    {{filter_fields}}
    <label>Sort<select id="carsort">
      <option value="date">Newest inspection</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="km">Mileage: lowest</option>
      <option value="year">Year: newest</option>
    </select></label>
    <button type="reset" class="btn ghost">Clear</button>
  </form>
  <noscript><p class="note">Filters need JavaScript. All cars are listed.</p></noscript>
  <p class="count" id="carcount" aria-live="polite">{{car_count_text}}</p>
  <div class="cars" id="carlist">{{car_cards}}</div>
  <div class="empty" id="nomatch" hidden><b>No cars match these filters</b><span>Clear a filter to see more cars.</span></div>
  {{car_empty}}
</div></section>
{{saaz_config}}
{{cars_script}}
